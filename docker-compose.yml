services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: gods-eye-backend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-operations_db}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:${HOST_PORT:-8081}}
      - SF_LOGIN_URL=${SF_LOGIN_URL:-${SALESFORCE_LOGIN_URL:-https://login.salesforce.com}}
      - SF_CLIENT_ID=${SF_CLIENT_ID:-${SALESFORCE_CLIENT_ID:-}}
      - SF_CLIENT_SECRET=${SF_CLIENT_SECRET:-${SALESFORCE_CLIENT_SECRET:-}}
      - SF_USERNAME=${SF_USERNAME:-${SALESFORCE_USERNAME:-}}
      - SF_PASSWORD=${SF_PASSWORD:-${SALESFORCE_PASSWORD:-}}
      - SF_SECURITY_TOKEN=${SF_SECURITY_TOKEN:-${SALESFORCE_SECURITY_TOKEN:-}}
      - SF_INSTANCE_URL=${SF_INSTANCE_URL:-${SALESFORCE_INSTANCE_URL:-https://greyorangeorg.my.salesforce.com}}
      - SF_API_VERSION=${SF_API_VERSION:-v59.0}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - OPSGENIE_API_KEY=${OPSGENIE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-minimax/minimax-m3.1-flash:free}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - RED_ZONE_SHEET_URL=${RED_ZONE_SHEET_URL:-https://docs.google.com/spreadsheets/d/1dKhduZF_lYKWMrQ2bYBvufUxZt6oeQibNtx78P_id9M/edit?gid=1207923458#gid=1207923458}
      - PULSE_AI_SECRET=${PULSE_AI_SECRET:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - NO_PROXY=localhost,127.0.0.1,backend,gods-eye-backend,${NO_PROXY:-}
      - no_proxy=localhost,127.0.0.1,backend,gods-eye-backend,${no_proxy:-}
    networks:
      - gods-eye-net
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      network: host
    container_name: gods-eye-frontend
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8081}:80"
    volumes:
      - ./Frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gods-eye-net
    depends_on:
      - backend

networks:
  gods-eye-net:
    name: gods-eye-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.10.0/24
